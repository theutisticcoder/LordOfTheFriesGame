<!DOCTYPE html>
<html>

<head>
    <title>Lord Of The Fries</title>
    <script type="module" src="https://konsumer.js.org/raylib-wasm/raylib/raylib.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
    <script src="https://unpkg.com/raylib-js/dist/raylib.js"></script>
</head>

<body>
    <script>
        async function run() {
            const r = await raylib();


            // 1. Initialize Window
            const screenWidth = 800;
            const screenHeight = 450;
            r.InitWindow(screenWidth, screenHeight, "Raylib Node.js - Model Loading");

            // 2. Define the Camera
            // In node-raylib, we pass an object that matches the Camera3D struct
            const camera = {
                position: { x: 0, y: 10, z: 10 },
                target: { x: 0, y: 0, z: 0 },
                up: { x: 0, y: 1, z: 0 },
                fovy: 45,
                projection: r.CAMERA_PERSPECTIVE
            };

            // 3. Load the Model
            // Ensure the path is correct relative to where you run 'node index.js'
            const model = r.LoadModel("./abandoned_mcdonalds.glb");

            r.SetTargetFPS(60);

            // 4. Main Game Loop
            while (!r.WindowShouldClose()) {
                // Update
                // Note: UpdateCamera in node-raylib takes the camera object and returns the updated one
                r.UpdateCamera(camera, r.CAMERA_FIRST_PERSON);

                // Draw
                r.BeginDrawing();
                r.ClearBackground(r.RED);

                r.BeginMode3D(camera);
                // DrawModel(model, position, scale, tint)
                r.DrawModel(model, { x: 0, y: 0, z: 0 }, 250.0, r.WHITE);
                r.EndMode3D();

                r.DrawFPS(10, 10);
                r.EndDrawing();
            }

            // 5. De-Initialization
            r.UnloadModel(model);
            r.CloseWindow();
        }
        run();
    </script>
</body>

</html>
